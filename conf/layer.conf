# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lipl"
BBFILE_PATTERN_meta-lipl = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lipl = "6"

LAYERDEPENDS_meta-lipl = "core wayland"
LAYERSERIES_COMPAT_meta-lipl = "wrynose"
